name: vpn-wg

services:
  nginx-proxy:
    image: ${NGINX_PROXY_IMAGE:-nginxproxy/nginx-proxy:1.11.0}
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - nginx_conf:/etc/nginx/conf.d
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - nginx_dhparam:/etc/nginx/dhparam
      - acme_certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy

  acme-companion:
    image: ${ACME_COMPANION_IMAGE:-nginxproxy/acme-companion:2.6.3}
    container_name: nginx-proxy-acme
    restart: unless-stopped
    environment:
      DEFAULT_EMAIL: ${LETSENCRYPT_EMAIL}
      NGINX_PROXY_CONTAINER: nginx-proxy
    volumes:
      - nginx_conf:/etc/nginx/conf.d
      - nginx_vhost:/etc/nginx/vhost.d
      - nginx_html:/usr/share/nginx/html
      - acme_certs:/etc/nginx/certs:rw
      - acme_state:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      nginx-proxy:
        condition: service_started
    networks:
      - proxy

  wg-easy:
    image: ${WG_EASY_IMAGE:-ghcr.io/wg-easy/wg-easy:15}
    container_name: wg-easy
    restart: unless-stopped
    ports:
      - "${WG_PORT}:${WG_PORT}/udp"
    expose:
      - "51821"
    environment:
      PORT: "51821"
      HOST: "0.0.0.0"
      INSECURE: "false"
      DISABLE_IPV6: ${WG_DISABLE_IPV6:-true}
      INIT_ENABLED: ${WG_INIT_ENABLED:-false}
      INIT_USERNAME: ${WG_ADMIN_USERNAME:-admin}
      INIT_PASSWORD: ${WG_ADMIN_PASSWORD:-}
      INIT_HOST: ${WG_HOST}
      INIT_PORT: ${WG_PORT}
      INIT_DNS: ${WG_DNS:-1.1.1.1,8.8.8.8}
      INIT_IPV4_CIDR: ${WG_IPV4_CIDR:-10.8.0.0/24}
      INIT_IPV6_CIDR: ${WG_IPV6_CIDR:-fdcc:ad94:bacf:61a3::/64}
      INIT_ALLOWED_IPS: ${WG_ALLOWED_IPS:-0.0.0.0/0}
      VIRTUAL_HOST: ${WG_UI_DOMAIN}
      VIRTUAL_PORT: "51821"
      LETSENCRYPT_HOST: ${WG_UI_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - wg_data:/etc/wireguard
      - /lib/modules:/lib/modules:ro
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1
    depends_on:
      nginx-proxy:
        condition: service_started
      acme-companion:
        condition: service_started
    networks:
      - proxy

  beszel:
    image: ${BESZEL_IMAGE:-henrygd/beszel:v0.18.7}
    container_name: beszel
    restart: unless-stopped
    profiles:
      - monitoring
    expose:
      - "8090"
    environment:
      APP_URL: https://${BESZEL_DOMAIN}
      CHECK_UPDATES: "false"
      VIRTUAL_HOST: ${BESZEL_DOMAIN}
      VIRTUAL_PORT: "8090"
      LETSENCRYPT_HOST: ${BESZEL_DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL}
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - proxy

  beszel-agent:
    image: ${BESZEL_AGENT_IMAGE:-henrygd/beszel-agent:v0.18.7}
    container_name: beszel-agent
    restart: unless-stopped
    profiles:
      - monitoring
    network_mode: host
    environment:
      DATA_DIR: /var/lib/beszel-agent
      LISTEN: ${BESZEL_AGENT_LISTEN:-/beszel_socket/beszel.sock}
      HUB_URL: https://${BESZEL_DOMAIN}
      TOKEN: ${BESZEL_AGENT_TOKEN:-}
      KEY: ${BESZEL_AGENT_KEY:-}
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 120s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  proxy:
    name: vpn-wg-proxy
    driver: bridge

volumes:
  nginx_conf:
  nginx_vhost:
  nginx_html:
  nginx_dhparam:
  acme_certs:
  acme_state:
  wg_data:
